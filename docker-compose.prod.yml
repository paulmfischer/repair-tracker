services:
  app:
    image: ghcr.io/paulmfischer/repair-tracker:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__MongoDB=mongodb://mongo:27017
      - MongoDB__Database=RepairTracker
      - Uploads__Path=/data/uploads
      - DataProtection__Path=/data/keys
      - Seq__ServerUrl=${SEQ_SERVER_URL:-}
    volumes:
      - uploads:/data/uploads
      - keys:/data/keys
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=RepairTracker

volumes:
  mongo_data:
  uploads:
  keys:
