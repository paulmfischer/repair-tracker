services:
  mongodb:
    image: mongo:7.0
    container_name: repair-tracker-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: RepairTracker

  seq:
    image: docker.io/datalust/seq:latest
    container_name: repair-tracker-seq
    restart: unless-stopped
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"

volumes:
  mongo_data:
  seq_data:
